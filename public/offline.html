<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión · Ibasho</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px;
        text-align: center; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
        background: #f7f0e1; color: #3a3328;
      }
      img { width: 88px; height: 88px; }
      h1 { font-size: 1.5rem; margin: 16px 0 8px; }
      p { margin: 0 0 20px; color: #7a6f5d; }
      button {
        min-height: 44px; padding: 0 28px; border: 0; border-radius: 16px;
        background: #3f6b4a; color: #fffaf0; font-size: 1rem; cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #11192b; color: #f3e9d2; }
        p { color: #a9b0c4; }
        button { background: #7fb58c; color: #11192b; }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/logo.svg" alt="Ibasho" />
      <h1>Sin conexión</h1>
      <p>No hay internet ahora mismo. Vuelve a intentarlo en un momento.</p>
      <button onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
